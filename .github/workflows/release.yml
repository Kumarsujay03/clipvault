name: Release

# Push a tag like v0.3.0 to build the .deb and AppImage and publish a GitHub release.
# Installed copies of ClipVault find it through Settings -> Updates and `clipvault --update`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Building on the oldest supported Ubuntu keeps the packages compatible with 24.04+.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # A tag pushed again (for example after rewriting history) must not fail or replace
      # files people have already downloaded and verified: skip if the release exists.
      - name: Skip if this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists; leaving its published files unchanged."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tag matches the app version
        if: steps.existing.outputs.exists != 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: System libraries
        if: steps.existing.outputs.exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf file

      - uses: actions/setup-node@v5
        if: steps.existing.outputs.exists != 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.existing.outputs.exists != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.existing.outputs.exists != 'true'
        with:
          workspaces: src-tauri

      - name: Test
        if: steps.existing.outputs.exists != 'true'
        run: |
          npm ci
          npm test
          node scripts/build-daemon.mjs debug
          (cd src-tauri && cargo test --workspace --lib)

      - name: Build packages
        if: steps.existing.outputs.exists != 'true'
        run: npm run tauri build

      - name: Collect artifacts and checksums
        if: steps.existing.outputs.exists != 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          cp "src-tauri/target/release/bundle/deb/ClipVault_${version}_amd64.deb" out/
          cp "src-tauri/target/release/bundle/appimage/ClipVault_${version}_amd64.AppImage" out/
          (cd out && sha256sum ClipVault_* > SHA256SUMS && cat SHA256SUMS)
          # Release notes = this version's CHANGELOG section.
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          printf '\n---\n**Install:** `sudo apt install ./ClipVault_%s_amd64.deb && clipvault --setup`, then log out and back in once.\n**Already using ClipVault 0.2 or newer?** Settings → Updates → Install update, or run `clipvault --update`.\nVerify downloads with `sha256sum -c SHA256SUMS`.\n' "$version" >> notes.md

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "$GITHUB_REF_NAME" out/* --title "ClipVault $version" --notes-file notes.md
